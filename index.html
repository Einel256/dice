<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182522">
  <title>骰子室 | CoC 6版ロールツール</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a27;
      --muted: #68736e;
      --paper: #f3f5f0;
      --panel: #ffffff;
      --line: #dce2dc;
      --deep: #182522;
      --green: #236b58;
      --green-soft: #e4f0eb;
      --orange: #bd573e;
      --orange-soft: #fbede7;
      --gold: #b8872f;
      --shadow: 0 12px 32px rgba(24, 37, 34, .07);
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d8e0d9 0.7px, transparent 0.7px);
      background-size: 17px 17px;
    }
    button, input, select, textarea { font: inherit; }
    button, select, input { min-height: 42px; }
    button { cursor: pointer; }
    .topbar {
      background: var(--deep);
      color: #f5f5ec;
      border-bottom: 3px solid var(--green);
    }
    .topbar-inner, main { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
    .topbar-inner { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border: 1px solid #78958a; color: #c4e0d5; font-size: 20px; transform: rotate(45deg);
    }
    .brand-mark span { transform: rotate(-45deg); }
    .brand h1 { margin: 0; font-size: 19px; letter-spacing: .04em; font-weight: 700; }
    .brand p { margin: 4px 0 0; color: #b8c4bf; font-size: 12px; }
    .edition { color: #c7d6cf; font-size: 12px; border: 1px solid #52645c; padding: 7px 10px; }
    main { padding: 28px 0 44px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 13px; }
    .section-heading h2 { margin: 0; font-size: 15px; letter-spacing: .02em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .character-grid, .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .panel {
      min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
    }
    .character-panel { padding: 17px; border-top: 3px solid var(--green); }
    .character-panel.b { border-top-color: var(--orange); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .panel-head h3 { margin: 0; font-size: 14px; }
    .badge { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .b .badge { color: var(--orange); }
    textarea {
      display: block; width: 100%; min-height: 144px; resize: vertical; padding: 11px 12px;
      color: var(--ink); background: #fafbf8; border: 1px solid var(--line); border-radius: 4px; line-height: 1.55; font-size: 12px;
    }
    textarea:focus, input:focus, select:focus { outline: 2px solid #8ab9a8; outline-offset: 1px; border-color: var(--green); }
    .panel-actions { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px;
      color: white; background: var(--green); border: 1px solid var(--green); border-radius: 4px; font-weight: 700; font-size: 12px;
      transition: background .15s ease, transform .15s ease;
    }
    .button:hover { background: #185442; transform: translateY(-1px); }
    .button.secondary { background: white; color: var(--ink); border-color: var(--line); }
    .button.secondary:hover { background: #f0f4f0; }
    .button.orange { background: var(--orange); border-color: var(--orange); }
    .button.orange:hover { background: #a54833; }
    .load-status { min-width: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .load-status.error { color: #a33d2a; }
    .loaded-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 20px; }
    .data-chip { background: #eef3ef; color: #4d5b54; border-radius: 3px; padding: 4px 7px; font-size: 10px; }
    .tools { margin-top: 27px; }
    .tool-panel { overflow: hidden; }
    .tool-title { min-height: 56px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .tool-title h3 { margin: 0; font-size: 15px; }
    .rule-tag { color: var(--muted); font-size: 11px; }
    .tool-body { padding: 18px; }
    .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 9px 10px; align-items: center; }
    .field-grid label, .solo-fields label { color: var(--muted); font-size: 11px; }
    select, input[type="number"] {
      width: 100%; padding: 0 10px; color: var(--ink); background: #fbfcfa; border: 1px solid var(--line); border-radius: 4px; font-size: 13px;
    }
    .side-label { display: flex; align-items: center; gap: 7px; color: var(--ink) !important; font-size: 12px !important; font-weight: 700; }
    .side-label::before { content: ""; width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
    .side-label.side-b::before { background: var(--orange); }
    .divider { height: 1px; margin: 15px 0; background: var(--line); }
    .chance-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 12px; padding: 12px; background: #f4f7f3; border-left: 3px solid var(--green); }
    .chance-row span { color: var(--muted); font-size: 12px; }
    .chance { color: var(--green); font-size: 24px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chance small { font-size: 13px; }
    .roll-result { min-height: 45px; margin-top: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f5f6f3; border-radius: 4px; }
    .roll-result:empty { display: none; }
    .result-text { font-size: 12px; font-weight: 700; }
    .result-detail { color: var(--muted); font-size: 11px; text-align: right; }
    .success { color: var(--green); }
    .failure { color: var(--orange); }
    .critical { color: #9b6d15; }
    .solo-block { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .solo-block h4 { margin: 0 0 11px; font-size: 12px; }
    .solo-fields { display: grid; grid-template-columns: 1fr 1.2fr 82px; gap: 9px; align-items: end; }
    .solo-fields label { display: grid; gap: 6px; }
    .solo-fields .button { grid-column: 1 / -1; }
    .solo-fields-wide { grid-template-columns: 1fr 1fr; margin-bottom: 13px; }
    .solo-fields-wide .solo-item-label { grid-column: 1 / -1; }
    .solo-fields-wide label:last-child { grid-column: 1 / -1; }
    .contest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .side-fields { min-width: 0; margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 4px; }
    .side-fields legend { padding: 0 5px; font-size: 12px; font-weight: 700; }
    .side-fields label, .edition-control { display: grid; gap: 5px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .side-fields select, .side-fields input, .solo-fields-wide select, .solo-fields-wide input, .edition-control select { min-width: 0; }
    .edition-control { display: flex; align-items: center; gap: 9px; margin: 0; }
    .edition-control select { min-width: 125px; }
    .roll-result { flex-wrap: wrap; }
    .roll-command { color: var(--deep); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 700; }
    .copy-button { min-height: 34px; padding: 0 10px; background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 700; }
    .copy-button:hover { background: #eef3ef; }
    .character-grid { align-items: start; }
    .character-card { display: flex; flex-direction: column; gap: 10px; }
    .character-card textarea { min-height: 170px; }
    .character-card .panel-head h3 { overflow-wrap: anywhere; }
    .character-card .panel-actions { flex-wrap: wrap; }
    .character-card .remove-character { margin-left: auto; }
    .character-card .load-status { flex: 1 1 130px; }
    .solo-roll-button { width: 100%; }
    .small-note { margin: 11px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .footer-note { margin: 17px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; text-align: center; }
    .drop-zone { min-height: 94px; display: flex; justify-content: center; align-items: center; gap: 14px; border: 1px dashed #9aaca2; border-radius: 5px; background: rgba(255,255,255,.76); cursor: pointer; }
    .drop-zone.is-over { border-color: var(--green); background: var(--green-soft); }
    .drop-zone input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    .drop-zone span:last-of-type { display: grid; gap: 5px; }
    .drop-zone strong { font-size: 13px; }
    .drop-zone small, .section-caption { color: var(--muted); font-size: 11px; }
    .drop-icon { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--green); font-size: 20px; }
    .character-grid { margin-top: 13px; }
    .character-card { padding: 12px 14px; border-top-width: 2px; box-shadow: none; }
    .character-card .panel-head { margin: 0; }
    .character-card .panel-head h3 { font-size: 13px; }
    .character-card .remove-character { min-height: 32px; padding: 0 9px; font-size: 11px; }
    .palette-fields { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr 100px; gap: 10px; align-items: end; }
    .palette-fields label, .preset-actions label { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
    .command-line { min-height: 58px; margin-top: 14px; padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f4f7f3; border-left: 3px solid var(--green); }
    .command-line code { font: 700 17px ui-monospace, "SFMono-Regular", Consolas, monospace; color: var(--deep); }
    .preset-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; align-items: end; margin-top: 15px; }
    .preset-actions .button { min-width: 72px; }
    .preset-list { display: grid; gap: 7px; margin-top: 12px; }
    .preset-row { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 7px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
    .preset-main { min-width: 0; display: grid; gap: 3px; padding: 0; text-align: left; color: var(--ink); border: 0; background: transparent; }
    .preset-main strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .preset-main small { color: var(--muted); font-size: 10px; }
    .preset-command { font: 700 12px ui-monospace, "SFMono-Regular", Consolas, monospace; white-space: nowrap; }
    .empty-presets { padding: 11px 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 720px) {
      .topbar-inner, main { width: min(100% - 28px, 560px); }
      .topbar-inner { min-height: 72px; }
      .character-grid, .tool-grid { grid-template-columns: 1fr; }
      .tools { margin-top: 23px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .tool-panel + .tool-panel { margin-top: 2px; }
      .contest-grid { grid-template-columns: 1fr; }
      .palette-fields { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 420px) {
      .edition { padding: 6px 7px; font-size: 10px; }
      .brand h1 { font-size: 17px; }
      .character-panel, .tool-body { padding: 14px; }
      .solo-fields { grid-template-columns: 1fr 1fr; }
      .solo-fields label:first-child { grid-column: 1 / -1; }
      .edition-control { width: 100%; justify-content: space-between; }
      .edition-control select { flex: 1; }
      .palette-fields { grid-template-columns: 1fr; }
      .section-heading { flex-wrap: wrap; }
      .preset-row { grid-template-columns: minmax(0, 1fr) auto; }
      .preset-command { grid-column: 1; grid-row: 2; }
      .preset-row .delete-preset { grid-column: 2; grid-row: 1 / span 2; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>骰</span></div>
        <div><h1>骰子室</h1><p>キャラクターシート・ロール計算</p></div>
      </div>
      <div class="edition" id="header-edition">クトゥルフ神話TRPG 第6版</div>
    </div>
  </header>

  <main>
    <section aria-labelledby="characters-heading">
      <div class="section-heading"><h2 id="characters-heading">キャラクターシート</h2><span class="load-status" id="import-status" aria-live="polite">テキストファイルをドロップ</span></div>
      <label class="drop-zone" id="drop-zone" for="sheet-files">
        <span class="drop-icon" aria-hidden="true">＋</span>
        <span><strong>シートをここにドロップ</strong><small>複数ファイル可 · .txt</small></span>
        <input id="sheet-files" type="file" accept=".txt,text/plain" multiple>
      </label>
      <div class="character-grid" id="character-list"></div>
    </section>

    <section class="tools" aria-label="チャットパレット">
      <div class="section-heading"><h2>チャットパレット</h2><label class="edition-control"><select id="edition-select" aria-label="ルールの版"><option value="6">CoC 6版</option><option value="7">CoC 7版</option></select></label></div>
      <article class="panel tool-panel"><div class="tool-body">
        <div class="palette-fields">
          <label>キャラクター<select id="palette-character"></select></label>
          <label>判定種別<select id="palette-kind"><option value="skill">技能</option><option value="stat">能力値</option><option value="custom">任意の値</option></select></label>
          <label class="palette-item-label">項目<select id="palette-item"></select></label>
          <label>目標値<input id="palette-value" type="number" min="0" max="999" value="50"></label>
        </div>
        <div class="command-line"><code id="palette-command">CCB&lt;=50</code><button class="button" id="copy-palette" type="button">コピー</button></div>
      </div></article>
    </section>

    <section class="tools" aria-label="対抗ロールプリセット">
      <div class="section-heading"><h2>対抗プリセット</h2><span class="section-caption">組み合わせを保存してすぐコピー</span></div>
      <article class="panel tool-panel"><div class="tool-body">
        <div class="contest-grid">
          <fieldset class="side-fields"><legend>能動側</legend>
            <label>キャラクター<select id="active-character"></select></label>
            <label>判定種別<select id="active-kind"><option value="stat">能力値</option><option value="skill">技能</option><option value="custom">任意の値</option></select></label>
            <label class="source-field">項目<select id="active-item"></select></label>
            <label>値<input id="active-value" type="number" min="0" max="999" value="50"></label>
          </fieldset>
          <fieldset class="side-fields"><legend>受動側</legend>
            <label>キャラクター<select id="passive-character"></select></label>
            <label>判定種別<select id="passive-kind"><option value="stat">能力値</option><option value="skill">技能</option><option value="custom">任意の値</option></select></label>
            <label class="source-field">項目<select id="passive-item"></select></label>
            <label>値<input id="passive-value" type="number" min="0" max="999" value="50"></label>
          </fieldset>
        </div>
        <div class="chance-row"><span id="contest-caption">6版 対抗成功率</span><strong class="chance" id="contest-chance">50%</strong></div>
        <div class="preset-actions"><label>プリセット名<input id="preset-name" type="text" maxlength="48" placeholder="例: STR対抗"></label><button class="button" id="save-preset" type="button">保存</button></div>
        <div class="preset-list" id="preset-list" aria-live="polite"></div>
      </div></article>
    </section>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const charsKey = "dice-room-characters-v2";
      const presetsKey = "dice-room-contest-presets-v1";
      const statRows = [["STR", "筋力"], ["CON", "耐久力"], ["POW", "精神力"], ["DEX", "敏捷性"], ["APP", "外見"], ["SIZ", "体格"], ["INT", "知性"], ["EDU", "教育"], ["SAN", "正気度"], ["幸運", "幸運"], ["アイデア", "アイデア"], ["知識", "知識"]];
      const aliases = new Map([["STR", "STR"], ["筋力", "STR"], ["CON", "CON"], ["耐久力", "CON"], ["POW", "POW"], ["精神力", "POW"], ["DEX", "DEX"], ["敏捷性", "DEX"], ["APP", "APP"], ["外見", "APP"], ["SIZ", "SIZ"], ["体格", "SIZ"], ["INT", "INT"], ["知性", "INT"], ["EDU", "EDU"], ["教育", "EDU"], ["SAN", "SAN"], ["幸運", "幸運"], ["アイデア", "アイデア"], ["知識", "知識"]]);
      let nextId = 1;
      let characters = loadJSON(charsKey, []);
      let presets = loadJSON(presetsKey, []);
      if (!characters.length) characters = [newCharacter()];
      nextId = Math.max(0, ...characters.map((character) => Number(String(character.id).replace(/\D/g, "")) || 0)) + 1;

      function loadJSON(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
      }
      function saveCharacters() { localStorage.setItem(charsKey, JSON.stringify(characters)); }
      function newCharacter() { return { id: `char-${nextId++}`, name: "", stats: {}, skills: {}, raw: "" }; }
      function parseSheet(text) {
        const data = { name: "", stats: {}, skills: {}, raw: text };
        const lines = text.split(/\r?\n/);
        const name = lines.find((line) => /^\s*(?:【基本情報】\s*)?名前\s*[:：]/.test(line));
        if (name) data.name = name.replace(/^\s*(?:【基本情報】\s*)?名前\s*[:：]\s*/, "").trim();
        let skills = false;
        for (const line of lines) {
          if (/【\s*技能値\s*】/.test(line)) skills = true;
          if (!skills) {
            const match = line.match(/^\s*([^\s]+)\s+(-?\d+)(?:\s+[-\d]+)*/);
            if (match) {
              const key = aliases.get(match[1].toUpperCase()) || aliases.get(match[1]);
              if (key) data.stats[key] = Number(match[2]);
            }
          } else {
            if (!line.trim() || /技能値|技能名|合計|初期値|職業P|興味P|成長分|その他/.test(line) || /^\s*[『「【]/.test(line)) continue;
            const match = line.match(/^\s*(.*?)\s+(\d{1,3})(?:\s+\d{1,3}){0,6}\s*$/);
            if (match && match[1].trim() && !/^[-\d\s]+$/.test(match[1])) data.skills[match[1].trim()] = Number(match[2]);
          }
        }
        return data;
      }
      function addOptions(select, values, selected) {
        const previous = selected ?? select.value;
        select.replaceChildren();
        for (const [value, label] of values) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          select.append(option);
        }
        if (values.some(([value]) => String(value) === String(previous))) select.value = previous;
      }
      function characterLabel(character) { return character.name || `キャラクター ${characters.indexOf(character) + 1}`; }
      function setCharacterOptions(select) {
        const selected = select.value;
        addOptions(select, characters.map((character) => [character.id, characterLabel(character)]), selected);
      }
      function valueLabel(value) { return `${value}`; }
      function updateItemSelect(prefix) {
        const character = characters.find((item) => item.id === $(`${prefix}-character`).value) || characters[0];
        const kind = $(`${prefix}-kind`).value;
        const itemSelect = $(`${prefix}-item`);
        const itemLabel = itemSelect.closest("label");
        itemLabel.hidden = kind === "custom";
        if (kind === "custom") return;
        const values = kind === "stat" ? character.stats : character.skills;
        const entries = Object.entries(values).sort(([a], [b]) => a.localeCompare(b, "ja"));
        const prior = itemSelect.value;
        addOptions(itemSelect, entries.length ? entries.map(([key, value]) => [key, `${key} (${valueLabel(value)})`]) : [["", "項目なし"]], prior);
        if (values[itemSelect.value] !== undefined) $(`${prefix}-value`).value = values[itemSelect.value];
      }
      function refreshAll() {
        for (const id of ["palette-character", "active-character", "passive-character"]) setCharacterOptions($(id));
        updateItemSelect("palette");
        updateItemSelect("active");
        updateItemSelect("passive");
        updatePaletteCommand();
        updateContestChance();
        renderCharacters();
        renderPresets();
      }
      function renderCharacters() {
        const list = $("character-list");
        list.replaceChildren();
        characters.forEach((character, index) => {
          const card = document.createElement("article");
          card.className = "panel character-panel character-card";
          const heading = document.createElement("div");
          heading.className = "panel-head";
          const name = document.createElement("h3");
          name.textContent = characterLabel(character);
          const counts = document.createElement("span");
          counts.className = "badge";
          counts.textContent = `${Object.keys(character.stats).length} 能力値 · ${Object.keys(character.skills).length} 技能`;
          const remove = document.createElement("button");
          remove.className = "button secondary remove-character";
          remove.type = "button";
          remove.textContent = "削除";
          remove.setAttribute("aria-label", `${characterLabel(character)}を削除`);
          remove.addEventListener("click", () => {
            characters.splice(index, 1);
            if (!characters.length) characters.push(newCharacter());
            saveCharacters();
            refreshAll();
          });
          heading.append(name, counts, remove);
          card.append(heading);
          list.append(card);
        });
      }
      function receiveFiles(files) {
        const textFiles = [...files].filter((file) => file.type === "text/plain" || /\.txt$/i.test(file.name));
        if (!textFiles.length) {
          $("import-status").textContent = "テキストファイル（.txt）を選択してください";
          return;
        }
        Promise.all(textFiles.map(async (file) => ({ file, text: await file.text() }))).then((loaded) => {
          if (characters.length === 1 && !characters[0].raw && !characters[0].name && !Object.keys(characters[0].stats).length && !Object.keys(characters[0].skills).length) characters = [];
          for (const { file, text } of loaded) {
            const parsed = parseSheet(text);
            if (!parsed.name) parsed.name = file.name.replace(/\.txt$/i, "");
            characters.push({ ...parsed, id: `char-${nextId++}` });
          }
          saveCharacters();
          refreshAll();
          $("import-status").textContent = `${textFiles.length} 件のファイルを読み込みました`;
        }).catch(() => { $("import-status").textContent = "ファイルを読み込めませんでした"; });
      }
      function commandTarget(prefix) {
        const raw = Math.max(0, Number($(`${prefix}-value`).value) || 0);
        return $(`${prefix}-kind`).value === "stat" ? Math.min(100, raw * 5) : Math.min(100, raw);
      }
      function updatePaletteCommand() { $("palette-command").textContent = `CCB<=${commandTarget("palette")}`; }
      function updateContestChance() {
        const chance = Math.max(0, Math.min(100, 50 + (Number($("active-value").value || 0) - Number($("passive-value").value || 0)) * 5));
        const value = $("edition-select").value === "6" && $("active-kind").value === "stat" && $("passive-kind").value === "stat" ? chance : commandTarget("active");
        $("contest-caption").textContent = $("edition-select").value === "6" ? "6版 対抗成功率" : "能動側の目標値（7版）";
        $("contest-chance").textContent = `${value}%`;
      }
      function snapshotPreset(name) {
        return { id: `preset-${Date.now()}-${Math.random().toString(16).slice(2)}`, name, edition: $("edition-select").value, active: captureSide("active"), passive: captureSide("passive") };
      }
      function presetTarget(side) {
        const value = Math.max(0, Number(side.value) || 0);
        return side.kind === "stat" ? Math.min(100, value * 5) : Math.min(100, value);
      }
      function captureSide(prefix) { return { character: $(`${prefix}-character`).value, kind: $(`${prefix}-kind`).value, item: $(`${prefix}-item`).value, value: $(`${prefix}-value`).value }; }
      function applyPreset(preset) {
        $("edition-select").value = preset.edition || "6";
        $("header-edition").textContent = `クトゥルフ神話TRPG 第${$("edition-select").value}版`;
        for (const prefix of ["active", "passive"]) {
          const side = preset[prefix];
          $(`${prefix}-character`).value = characters.some((character) => character.id === side.character) ? side.character : characters[0].id;
          $(`${prefix}-kind`).value = side.kind;
          updateItemSelect(prefix);
          if (side.item) $(`${prefix}-item`).value = side.item;
          $(`${prefix}-value`).value = side.value;
        }
        updatePaletteCommand();
        updateContestChance();
      }
      function renderPresets() {
        const list = $("preset-list");
        list.replaceChildren();
        if (!presets.length) {
          const empty = document.createElement("div");
          empty.className = "empty-presets";
          empty.textContent = "保存したプリセットはありません";
          list.append(empty);
          return;
        }
        for (const preset of presets) {
          const row = document.createElement("div");
          row.className = "preset-row";
          const apply = document.createElement("button");
          apply.className = "preset-main";
          apply.type = "button";
          const title = document.createElement("strong");
          title.textContent = preset.name;
          const caption = document.createElement("small");
          caption.textContent = `${preset.edition}版 · ${sideCaption(preset.active)} 対 ${sideCaption(preset.passive)}`;
          apply.append(title, caption);
          apply.addEventListener("click", () => applyPreset(preset));
          const target = presetTarget(preset.active);
          const command = document.createElement("code");
          command.className = "preset-command";
          command.textContent = `CCB<=${target}`;
          const copy = document.createElement("button");
          copy.className = "copy-button";
          copy.type = "button";
          copy.textContent = "コピー";
          copy.addEventListener("click", () => copyText(command.textContent, copy));
          const remove = document.createElement("button");
          remove.className = "copy-button delete-preset";
          remove.type = "button";
          remove.textContent = "削除";
          remove.setAttribute("aria-label", `${preset.name}を削除`);
          remove.addEventListener("click", () => {
            presets = presets.filter((item) => item.id !== preset.id);
            localStorage.setItem(presetsKey, JSON.stringify(presets));
            renderPresets();
          });
          row.append(apply, command, copy, remove);
          list.append(row);
        }
      }
      function sideCaption(side) {
        const character = characters.find((item) => item.id === side.character);
        return `${character ? characterLabel(character) : "キャラ"} ${side.item || side.kind}`;
      }
      async function copyText(text, button) {
        try { await navigator.clipboard.writeText(text); }
        catch {
          const temp = document.createElement("textarea");
          temp.value = text;
          document.body.append(temp);
          temp.select();
          document.execCommand("copy");
          temp.remove();
        }
        const label = button.textContent;
        button.textContent = "コピー済み";
        setTimeout(() => { button.textContent = label; }, 1200);
      }

      $("sheet-files").addEventListener("change", (event) => {
        receiveFiles(event.target.files);
        event.target.value = "";
      });
      const dropZone = $("drop-zone");
      for (const eventName of ["dragenter", "dragover"]) dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.add("is-over"); });
      for (const eventName of ["dragleave", "drop"]) dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.remove("is-over"); });
      dropZone.addEventListener("drop", (event) => receiveFiles(event.dataTransfer.files));
      for (const prefix of ["palette", "active", "passive"]) {
        $(`${prefix}-character`).addEventListener("change", () => updateItemSelect(prefix));
        $(`${prefix}-kind`).addEventListener("change", () => updateItemSelect(prefix));
        $(`${prefix}-item`).addEventListener("change", () => {
          const character = characters.find((item) => item.id === $(`${prefix}-character`).value) || characters[0];
          const values = $(`${prefix}-kind`).value === "stat" ? character.stats : character.skills;
          if (values[$(`${prefix}-item`).value] !== undefined) $(`${prefix}-value`).value = values[$(`${prefix}-item`).value];
          updatePaletteCommand();
          updateContestChance();
        });
        $(`${prefix}-value`).addEventListener("input", () => { updatePaletteCommand(); updateContestChance(); });
      }
      $("edition-select").addEventListener("change", () => {
        $("header-edition").textContent = `クトゥルフ神話TRPG 第${$("edition-select").value}版`;
        updatePaletteCommand();
        updateContestChance();
      });
      $("save-preset").addEventListener("click", () => {
        const name = $("preset-name").value.trim();
        if (!name) { $("preset-name").focus(); return; }
        presets.unshift(snapshotPreset(name));
        localStorage.setItem(presetsKey, JSON.stringify(presets));
        $("preset-name").value = "";
        renderPresets();
      });
      $("copy-palette").addEventListener("click", (event) => copyText($("palette-command").textContent, event.currentTarget));
      refreshAll();
    })();
  </script>
</body>
</html>
