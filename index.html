<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182522">
  <title>骰子室 | CoC 6版ロールツール</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a27;
      --muted: #68736e;
      --paper: #f3f5f0;
      --panel: #ffffff;
      --line: #dce2dc;
      --deep: #182522;
      --green: #236b58;
      --green-soft: #e4f0eb;
      --orange: #bd573e;
      --orange-soft: #fbede7;
      --gold: #b8872f;
      --shadow: 0 12px 32px rgba(24, 37, 34, .07);
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d8e0d9 0.7px, transparent 0.7px);
      background-size: 17px 17px;
    }
    button, input, select, textarea { font: inherit; }
    button, select, input { min-height: 42px; }
    button { cursor: pointer; }
    .topbar {
      background: var(--deep);
      color: #f5f5ec;
      border-bottom: 3px solid var(--green);
    }
    .topbar-inner, main { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
    .topbar-inner { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border: 1px solid #78958a; color: #c4e0d5; font-size: 20px; transform: rotate(45deg);
    }
    .brand-mark span { transform: rotate(-45deg); }
    .brand h1 { margin: 0; font-size: 19px; letter-spacing: .04em; font-weight: 700; }
    .brand p { margin: 4px 0 0; color: #b8c4bf; font-size: 12px; }
    .edition { color: #c7d6cf; font-size: 12px; border: 1px solid #52645c; padding: 7px 10px; }
    main { padding: 28px 0 44px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 13px; }
    .section-heading h2 { margin: 0; font-size: 15px; letter-spacing: .02em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .character-grid, .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .panel {
      min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
    }
    .character-panel { padding: 17px; border-top: 3px solid var(--green); }
    .character-panel.b { border-top-color: var(--orange); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .panel-head h3 { margin: 0; font-size: 14px; }
    .badge { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .b .badge { color: var(--orange); }
    textarea {
      display: block; width: 100%; min-height: 144px; resize: vertical; padding: 11px 12px;
      color: var(--ink); background: #fafbf8; border: 1px solid var(--line); border-radius: 4px; line-height: 1.55; font-size: 12px;
    }
    textarea:focus, input:focus, select:focus { outline: 2px solid #8ab9a8; outline-offset: 1px; border-color: var(--green); }
    .panel-actions { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px;
      color: white; background: var(--green); border: 1px solid var(--green); border-radius: 4px; font-weight: 700; font-size: 12px;
      transition: background .15s ease, transform .15s ease;
    }
    .button:hover { background: #185442; transform: translateY(-1px); }
    .button.secondary { background: white; color: var(--ink); border-color: var(--line); }
    .button.secondary:hover { background: #f0f4f0; }
    .button.orange { background: var(--orange); border-color: var(--orange); }
    .button.orange:hover { background: #a54833; }
    .load-status { min-width: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .load-status.error { color: #a33d2a; }
    .loaded-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 20px; }
    .data-chip { background: #eef3ef; color: #4d5b54; border-radius: 3px; padding: 4px 7px; font-size: 10px; }
    .tools { margin-top: 27px; }
    .tool-panel { overflow: hidden; }
    .tool-title { min-height: 56px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .tool-title h3 { margin: 0; font-size: 15px; }
    .rule-tag { color: var(--muted); font-size: 11px; }
    .tool-body { padding: 18px; }
    .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 9px 10px; align-items: center; }
    .field-grid label, .solo-fields label { color: var(--muted); font-size: 11px; }
    select, input[type="number"] {
      width: 100%; padding: 0 10px; color: var(--ink); background: #fbfcfa; border: 1px solid var(--line); border-radius: 4px; font-size: 13px;
    }
    .side-label { display: flex; align-items: center; gap: 7px; color: var(--ink) !important; font-size: 12px !important; font-weight: 700; }
    .side-label::before { content: ""; width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
    .side-label.side-b::before { background: var(--orange); }
    .divider { height: 1px; margin: 15px 0; background: var(--line); }
    .chance-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 12px; padding: 12px; background: #f4f7f3; border-left: 3px solid var(--green); }
    .chance-row span { color: var(--muted); font-size: 12px; }
    .chance { color: var(--green); font-size: 24px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
    .chance small { font-size: 13px; }
    .roll-result { min-height: 45px; margin-top: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f5f6f3; border-radius: 4px; }
    .roll-result:empty { display: none; }
    .result-text { font-size: 12px; font-weight: 700; }
    .result-detail { color: var(--muted); font-size: 11px; text-align: right; }
    .success { color: var(--green); }
    .failure { color: var(--orange); }
    .critical { color: #9b6d15; }
    .solo-block { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .solo-block h4 { margin: 0 0 11px; font-size: 12px; }
    .solo-fields { display: grid; grid-template-columns: 1fr 1.2fr 82px; gap: 9px; align-items: end; }
    .solo-fields label { display: grid; gap: 6px; }
    .solo-fields .button { grid-column: 1 / -1; }
    .solo-fields-wide { grid-template-columns: 1fr 1fr; margin-bottom: 13px; }
    .solo-fields-wide .solo-item-label { grid-column: 1 / -1; }
    .solo-fields-wide label:last-child { grid-column: 1 / -1; }
    .contest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .side-fields { min-width: 0; margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 4px; }
    .side-fields legend { padding: 0 5px; font-size: 12px; font-weight: 700; }
    .side-fields label, .edition-control { display: grid; gap: 5px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .side-fields select, .side-fields input, .solo-fields-wide select, .solo-fields-wide input, .edition-control select { min-width: 0; }
    .edition-control { display: flex; align-items: center; gap: 9px; margin: 0; }
    .edition-control select { min-width: 125px; }
    .roll-result { flex-wrap: wrap; }
    .roll-command { color: var(--deep); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 700; }
    .copy-button { min-height: 34px; padding: 0 10px; background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; font-weight: 700; }
    .copy-button:hover { background: #eef3ef; }
    .character-grid { align-items: start; }
    .character-card { display: flex; flex-direction: column; gap: 10px; }
    .character-card textarea { min-height: 170px; }
    .character-card .panel-head h3 { overflow-wrap: anywhere; }
    .character-card .panel-actions { flex-wrap: wrap; }
    .character-card .remove-character { margin-left: auto; }
    .character-card .load-status { flex: 1 1 130px; }
    .solo-roll-button { width: 100%; }
    .small-note { margin: 11px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .footer-note { margin: 17px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; text-align: center; }
    @media (max-width: 720px) {
      .topbar-inner, main { width: min(100% - 28px, 560px); }
      .topbar-inner { min-height: 72px; }
      .character-grid, .tool-grid { grid-template-columns: 1fr; }
      .tools { margin-top: 23px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .tool-panel + .tool-panel { margin-top: 2px; }
      .contest-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .edition { padding: 6px 7px; font-size: 10px; }
      .brand h1 { font-size: 17px; }
      .character-panel, .tool-body { padding: 14px; }
      .solo-fields { grid-template-columns: 1fr 1fr; }
      .solo-fields label:first-child { grid-column: 1 / -1; }
      .edition-control { width: 100%; justify-content: space-between; }
      .edition-control select { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>骰</span></div>
        <div><h1>骰子室</h1><p>キャラクターシート・ロール計算</p></div>
      </div>
      <div class="edition" id="header-edition">クトゥルフ神話TRPG 第6版</div>
    </div>
  </header>

  <main>
    <section aria-labelledby="characters-heading">
      <div class="section-heading">
        <h2 id="characters-heading">キャラクター</h2>
        <button class="button" id="add-character" type="button">＋ キャラクター追加</button>
      </div>
      <div class="character-grid" id="character-list"></div>
    </section>

    <section class="tools" aria-label="ロール計算">
      <div class="section-heading">
        <h2>ロール計算</h2>
        <label class="edition-control">ルール
          <select id="edition-select" aria-label="ルールの版"><option value="6">CoC 6版</option><option value="7">CoC 7版</option></select>
        </label>
      </div>
      <div class="tool-grid">
        <article class="panel tool-panel">
          <div class="tool-title"><h3>対抗ロール</h3><span class="rule-tag" id="contest-rule">6版: 50 + (能動値 − 受動値) × 5</span></div>
          <div class="tool-body">
            <div class="contest-grid">
              <fieldset class="side-fields"><legend>能動側</legend>
                <label>キャラクター<select id="active-character"></select></label>
                <label>判定種別<select id="active-kind"><option value="stat">能力値</option><option value="skill">技能</option><option value="custom">任意の値</option></select></label>
                <label class="source-field">項目<select id="active-item"></select></label>
                <label>目標値<input id="active-value" type="number" min="0" max="999" value="50"></label>
              </fieldset>
              <fieldset class="side-fields"><legend>受動側</legend>
                <label>キャラクター<select id="passive-character"></select></label>
                <label>判定種別<select id="passive-kind"><option value="stat">能力値</option><option value="skill">技能</option><option value="custom">任意の値</option></select></label>
                <label class="source-field">項目<select id="passive-item"></select></label>
                <label>目標値<input id="passive-value" type="number" min="0" max="999" value="50"></label>
              </fieldset>
            </div>
            <div class="chance-row"><span id="contest-chance-label">Aの対抗成功率</span><strong class="chance" id="contest-chance">50<small>%</small></strong></div>
            <button class="button" id="roll-contest" type="button">🎲 対抗ロール</button>
            <div class="roll-result" id="contest-result" aria-live="polite"></div>
            <p class="small-note" id="contest-note">6版の対抗成功率を表示します。対抗するキャラクターと項目は自由に組み合わせられます。</p>
          </div>
        </article>

        <article class="panel tool-panel">
          <div class="tool-title"><h3>単体判定</h3><span class="rule-tag">出力コマンド: CCB&lt;=n</span></div>
          <div class="tool-body">
            <div class="solo-fields solo-fields-wide">
              <label>キャラクター<select id="solo-character"></select></label>
              <label>判定種別<select id="solo-kind"><option value="skill">技能</option><option value="stat">能力値</option><option value="custom">任意の値</option></select></label>
              <label class="solo-item-label">項目<select id="solo-item"></select></label>
              <label>目標値<input id="solo-value" type="number" min="0" max="999" value="50"></label>
            </div>
            <button class="button orange solo-roll-button" id="roll-solo" type="button">🎲 1d100 を振る</button>
            <div class="roll-result" id="solo-result" aria-live="polite"></div>
            <p class="small-note">CCB&lt;=n 形式のコマンドを表示します。CoC7版では通常・ハード・イクストリーム成功も判定します。</p>
          </div>
        </article>
      </div>
      <p class="footer-note">コピーしたコマンドはココフォリア等のチャット欄に貼り付けて使えます。ダイス結果の裁定は卓のルールを優先してください。</p>
    </section>
  </main>

  <script>
    (() => {
      const statLabels = [
        ["STR", "STR / 筋力"], ["CON", "CON / 耐久力"], ["POW", "POW / 精神力"],
        ["DEX", "DEX / 敏捷性"], ["APP", "APP / 外見"], ["SIZ", "SIZ / 体格"],
        ["INT", "INT / 知性"], ["EDU", "EDU / 教育"], ["SAN", "SAN / 正気度"],
        ["幸運", "幸運"], ["アイデア", "アイデア"], ["知識", "知識"]
      ];
      const statAliases = new Map([
        ["STR", "STR"], ["筋力", "STR"], ["CON", "CON"], ["耐久力", "CON"],
        ["POW", "POW"], ["精神力", "POW"], ["DEX", "DEX"], ["敏捷性", "DEX"],
        ["APP", "APP"], ["外見", "APP"], ["SIZ", "SIZ"], ["体格", "SIZ"],
        ["INT", "INT"], ["知性", "INT"], ["EDU", "EDU"], ["教育", "EDU"],
        ["SAN", "SAN"], ["幸運", "幸運"], ["アイデア", "アイデア"], ["知識", "知識"]
      ]);
      const characters = [];
      let nextCharacterId = 1;
      const $ = (id) => document.getElementById(id);
      const emptyCharacter = () => ({ id: `character-${nextCharacterId++}`, name: "", raw: "", stats: {}, skills: {} });

      function parseCharacter(text) {
        const parsed = { name: "", stats: {}, skills: {} };
        const lines = text.split(/\r?\n/);
        const nameLine = lines.find((line) => /^\s*(?:【基本情報】\s*)?名前\s*[:：]/.test(line));
        if (nameLine) parsed.name = nameLine.replace(/^\s*(?:【基本情報】\s*)?名前\s*[:：]\s*/, "").trim();
        let inSkills = false;
        for (const line of lines) {
          if (/【\s*技能値\s*】/.test(line)) inSkills = true;
          if (!inSkills) {
            const match = line.match(/^\s*([^\s]+)\s+(-?\d+)(?:\s+[-\d]+)*/);
            if (match) {
              const key = statAliases.get(match[1].toUpperCase()) || statAliases.get(match[1]);
              if (key) parsed.stats[key] = Number(match[2]);
            }
            continue;
          }
          if (!line.trim() || /【\s*技能値\s*】|技能名|合計|初期値|職業P|興味P|成長分|その他/.test(line) || /^\s*[『「【]/.test(line)) continue;
          const match = line.match(/^\s*(.*?)\s+(\d{1,3})(?:\s+\d{1,3}){0,6}\s*$/);
          if (match && match[1].trim() && !/^[-\d\s]+$/.test(match[1])) parsed.skills[match[1].trim()] = Number(match[2]);
        }
        return parsed;
      }

      function addCharacter(data = emptyCharacter()) {
        characters.push(data);
        renderCharacters();
        refreshCharacterOptions();
      }

      function renderCharacters() {
        const list = $("character-list");
        list.replaceChildren();
        for (const character of characters) {
          const card = document.createElement("article");
          card.className = "panel character-panel character-card";
          card.dataset.characterId = character.id;
          card.innerHTML = `<div class="panel-head"><h3></h3><span class="badge">シート</span></div><textarea aria-label="キャラクターシートテキスト" placeholder="いあきゃら等のキャラクターシートテキストを貼り付け"></textarea><div class="panel-actions"><button class="button load-character" type="button">↓ 読み込む</button><span class="load-status" aria-live="polite">${Object.keys(character.stats).length || Object.keys(character.skills).length ? `${Object.keys(character.stats).length}能力値・${Object.keys(character.skills).length}技能` : "未読み込み"}</span><button class="button secondary remove-character" type="button" aria-label="キャラクターを削除" title="削除">削除</button></div><div class="loaded-summary"></div>`;
          card.querySelector("h3").textContent = character.name || `キャラクター ${characters.indexOf(character) + 1}`;
          const sheetInput = card.querySelector("textarea");
          sheetInput.value = character.raw;
          sheetInput.addEventListener("input", () => { character.raw = sheetInput.value; });
          const status = card.querySelector(".load-status");
          if (!Object.keys(character.stats).length && !Object.keys(character.skills).length && character.raw) status.classList.add("error");
          const summary = card.querySelector(".loaded-summary");
          if (Object.keys(character.stats).length) addChip(summary, `${Object.keys(character.stats).length} 能力値`);
          if (Object.keys(character.skills).length) addChip(summary, `${Object.keys(character.skills).length} 技能`);
          card.querySelector(".load-character").addEventListener("click", () => {
            character.raw = card.querySelector("textarea").value;
            Object.assign(character, parseCharacter(character.raw));
            renderCharacters();
            refreshCharacterOptions();
          });
          card.querySelector(".remove-character").disabled = characters.length === 1;
          card.querySelector(".remove-character").addEventListener("click", () => {
            if (characters.length === 1) return;
            characters.splice(characters.indexOf(character), 1);
            renderCharacters();
            refreshCharacterOptions();
          });
          list.append(card);
        }
      }

      function addChip(parent, text) {
        const chip = document.createElement("span");
        chip.className = "data-chip";
        chip.textContent = text;
        parent.append(chip);
      }

      function setOptions(select, items, preferred) {
        const previous = preferred ?? select.value;
        select.replaceChildren();
        for (const [value, label] of items) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          select.append(option);
        }
        if (items.some(([value]) => String(value) === String(previous))) select.value = previous;
      }

      function selectedCharacter(selectId) { return characters.find((item) => item.id === $(selectId).value) || characters[0]; }
      function characterOptions(selectId) {
        const select = $(selectId);
        const previous = select.value;
        setOptions(select, characters.map((character, index) => [character.id, character.name || `キャラクター ${index + 1}`]), previous);
      }

      function populateSide(prefix) {
        const character = selectedCharacter(`${prefix}-character`);
        const kind = $(`${prefix}-kind`).value;
        const itemSelect = $(`${prefix}-item`);
        const input = $(`${prefix}-value`);
        const sourceField = itemSelect.closest("label");
        sourceField.hidden = kind === "custom";
        if (kind === "custom") return;
        const values = kind === "stat" ? character.stats : character.skills;
        const items = Object.entries(values).sort(([a], [b]) => a.localeCompare(b, "ja"));
        const previous = itemSelect.value;
        setOptions(itemSelect, items.length ? items.map(([key, value]) => [key, `${key} (${value})`]) : [["", kind === "stat" ? "能力値なし" : "技能データなし"]], previous);
        if (itemSelect.value && values[itemSelect.value] !== undefined) input.value = values[itemSelect.value];
      }

      function refreshCharacterOptions() {
        for (const id of ["active-character", "passive-character", "solo-character"]) characterOptions(id);
        populateSide("active");
        populateSide("passive");
        populateSolo();
        updateContestChance();
      }

      function populateSolo() {
        const character = selectedCharacter("solo-character");
        const kind = $("solo-kind").value;
        const select = $("solo-item");
        const label = select.closest("label");
        label.hidden = kind === "custom";
        if (kind === "custom") return;
        const values = kind === "stat" ? character.stats : character.skills;
        const items = Object.entries(values).sort(([a], [b]) => a.localeCompare(b, "ja"));
        const previous = select.value;
        setOptions(select, items.length ? items.map(([key, value]) => [key, `${key} (${value})`]) : [["", kind === "stat" ? "能力値なし" : "技能データなし"]], previous);
        if (select.value && values[select.value] !== undefined) $("solo-value").value = values[select.value];
      }

      function updateEdition() {
        const seventh = $("edition-select").value === "7";
        $("header-edition").textContent = `クトゥルフ神話TRPG 第${seventh ? "7" : "6"}版`;
        $("contest-rule").textContent = seventh ? "7版: 双方の成功段階を比較" : "6版: 50 + (能動値 − 受動値) × 5";
        $("contest-chance-label").textContent = seventh ? "能動側の目標値" : "能動側の対抗成功率";
        $("contest-note").textContent = seventh ? "7版は双方が個別にロールし、成功段階を比較します。能力値は×5を目標値にします。" : "6版の対抗成功率を表示します。対抗するキャラクターと項目は自由に組み合わせられます。";
        updateContestChance();
      }

      function rawValue(prefix) { return Number($(`${prefix}-value`).value) || 0; }
      function testTarget(prefix) {
        const value = rawValue(prefix);
        return $("edition-select").value === "7" && $(`${prefix}-kind`).value === "stat" ? Math.min(100, value * 5) : Math.min(100, value);
      }
      function chance(active, passive) { return Math.max(0, Math.min(100, 50 + (active - passive) * 5)); }
      function updateContestChance() {
        const target = $("edition-select").value === "7" ? testTarget("active") : chance(rawValue("active"), rawValue("passive"));
        $("contest-chance").innerHTML = `${target}<small>${$("edition-select").value === "7" ? "%" : "%"}</small>`;
      }
      function d100() { return crypto.getRandomValues(new Uint32Array(1))[0] % 100 + 1; }
      function outcome(roll, target, edition) {
        if (roll === 1) return { rank: 4, text: "クリティカル", className: "critical" };
        if ((target < 50 && roll >= 96) || roll === 100) return { rank: 0, text: "ファンブル", className: "failure" };
        if (roll > target) return { rank: 0, text: "失敗", className: "failure" };
        if (edition === "7") {
          if (roll <= Math.floor(target / 5)) return { rank: 3, text: "イクストリーム成功", className: "success" };
          if (roll <= Math.floor(target / 2)) return { rank: 2, text: "ハード成功", className: "success" };
        }
        return { rank: 1, text: "成功", className: "success" };
      }

      function showResult(id, text, detail, command) {
        const box = $(id);
        box.replaceChildren();
        const label = document.createElement("span");
        label.className = "result-text";
        label.textContent = text;
        const info = document.createElement("span");
        info.className = "result-detail";
        info.textContent = detail;
        const code = document.createElement("code");
        code.className = "roll-command";
        code.textContent = command;
        const copy = document.createElement("button");
        copy.className = "copy-button";
        copy.type = "button";
        copy.textContent = "コピー";
        copy.setAttribute("aria-label", `${command} をコピー`);
        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(command);
          } catch {
            const temporary = document.createElement("textarea");
            temporary.value = command;
            temporary.style.position = "fixed";
            temporary.style.opacity = "0";
            document.body.append(temporary);
            temporary.select();
            document.execCommand("copy");
            temporary.remove();
          }
          copy.textContent = "コピー済み";
          setTimeout(() => { copy.textContent = "コピー"; }, 1400);
        });
        box.append(label, info, code, copy);
      }

      function rollContest() {
        const edition = $("edition-select").value;
        const active = testTarget("active");
        const passive = testTarget("passive");
        const activeName = selectedCharacter("active-character").name || "能動側";
        const passiveName = selectedCharacter("passive-character").name || "受動側";
        if (edition === "6") {
          const target = chance(rawValue("active"), rawValue("passive"));
          const roll = d100();
          const result = roll <= target ? "対抗成功" : "対抗失敗";
          showResult("contest-result", `${activeName}: ${result}`, `出目 ${roll} / 目標 ${target}%`, `CCB<=${target}`);
          return;
        }
        const activeRoll = d100();
        const passiveRoll = d100();
        const activeOutcome = outcome(activeRoll, active, edition);
        const passiveOutcome = outcome(passiveRoll, passive, edition);
        let resultText;
        if (activeOutcome.rank !== passiveOutcome.rank) resultText = `${activeOutcome.rank > passiveOutcome.rank ? activeName : passiveName}の勝利`;
        else if (activeOutcome.rank === 0) resultText = "双方失敗";
        else if (active > passive) resultText = `${activeName}の勝利`;
        else if (passive > active) resultText = `${passiveName}の勝利`;
        else resultText = "引き分け";
        const detail = `${activeName} ${activeRoll} (${activeOutcome.text}) / ${passiveName} ${passiveRoll} (${passiveOutcome.text})`;
        showResult("contest-result", resultText, detail, `CCB<=${active}`);
      }

      function rollSolo() {
        const target = testTarget("solo");
        const roll = d100();
        const result = outcome(roll, target, $("edition-select").value);
        const character = selectedCharacter("solo-character");
        showResult("solo-result", `${character.name || "判定"}: ${result.text}`, `出目 ${roll} / 目標 ${target}%`, `CCB<=${target}`);
      }

      $("add-character").addEventListener("click", () => addCharacter());
      $("edition-select").addEventListener("change", updateEdition);
      for (const prefix of ["active", "passive"]) {
        $(`${prefix}-character`).addEventListener("change", () => populateSide(prefix));
        $(`${prefix}-kind`).addEventListener("change", () => populateSide(prefix));
        $(`${prefix}-item`).addEventListener("change", () => {
          const character = selectedCharacter(`${prefix}-character`);
          const source = $( `${prefix}-kind`).value === "stat" ? character.stats : character.skills;
          if (source[$(`${prefix}-item`).value] !== undefined) $(`${prefix}-value`).value = source[$(`${prefix}-item`).value];
          updateContestChance();
        });
        $(`${prefix}-value`).addEventListener("input", updateContestChance);
      }
      $("solo-character").addEventListener("change", populateSolo);
      $("solo-kind").addEventListener("change", populateSolo);
      $("solo-item").addEventListener("change", populateSolo);
      $("solo-value").addEventListener("input", updateContestChance);
      $("roll-contest").addEventListener("click", rollContest);
      $("roll-solo").addEventListener("click", rollSolo);

      addCharacter();
      addCharacter();
      updateEdition();
      return;

      {
      const STAT_LABELS = [
        ["STR", "STR / 筋力"], ["CON", "CON / 耐久力"], ["POW", "POW / 精神力"],
        ["DEX", "DEX / 敏捷性"], ["APP", "APP / 外見"], ["SIZ", "SIZ / 体格"],
        ["INT", "INT / 知性"], ["EDU", "EDU / 教育"], ["SAN", "SAN / 正気度"],
        ["幸運", "幸運"], ["アイデア", "アイデア"], ["知識", "知識"]
      ];
      const STAT_ALIASES = new Map([
        ["STR", "STR"], ["筋力", "STR"], ["CON", "CON"], ["耐久力", "CON"],
        ["POW", "POW"], ["精神力", "POW"], ["DEX", "DEX"], ["敏捷性", "DEX"],
        ["APP", "APP"], ["外見", "APP"], ["SIZ", "SIZ"], ["体格", "SIZ"],
        ["INT", "INT"], ["知性", "INT"], ["EDU", "EDU"], ["教育", "EDU"],
        ["SAN", "SAN"], ["幸運", "幸運"], ["アイデア", "アイデア"], ["知識", "知識"]
      ]);
      const characters = { a: emptyCharacter(), b: emptyCharacter() };
      const $ = (id) => document.getElementById(id);

      function emptyCharacter() { return { name: "", stats: {}, skills: {} }; }

      function parseCharacter(text) {
        const parsed = emptyCharacter();
        const lines = text.split(/\r?\n/);
        const nameLine = lines.find((line) => /^\s*(?:【基本情報】\s*)?名前\s*[:：]/.test(line));
        if (nameLine) parsed.name = nameLine.replace(/^\s*(?:【基本情報】\s*)?名前\s*[:：]\s*/, "").trim();

        let inSkills = false;
        for (const line of lines) {
          if (/【\s*技能値\s*】/.test(line)) inSkills = true;
          if (!inSkills) {
            const statMatch = line.match(/^\s*([^\s]+)\s+(-?\d+)(?:\s+[-\d]+)*/);
            if (statMatch) {
              const key = STAT_ALIASES.get(statMatch[1].toUpperCase()) || STAT_ALIASES.get(statMatch[1]);
              if (key) parsed.stats[key] = Number(statMatch[2]);
            }
            continue;
          }
          if (!line.trim() || /【\s*技能値\s*】|技能名|合計|初期値|職業P|興味P|成長分|その他/.test(line) || /^\s*[『「【]/.test(line)) continue;
          const skillMatch = line.match(/^\s*(.*?)\s+(\d{1,3})(?:\s+\d{1,3}){0,6}\s*$/);
          if (!skillMatch) continue;
          const skillName = skillMatch[1].trim();
          if (!skillName || /^[-\d\s]+$/.test(skillName)) continue;
          parsed.skills[skillName] = Number(skillMatch[2]);
        }
        return parsed;
      }

      function readCharacter(id) {
        const parsed = parseCharacter($("sheet-" + id).value);
        characters[id] = parsed;
        const name = parsed.name || "キャラクター " + id.toUpperCase();
        $("character-name-" + id).textContent = name;
        const statCount = Object.keys(parsed.stats).length;
        const skillCount = Object.keys(parsed.skills).length;
        const status = $("status-" + id);
        if (!statCount && !skillCount) {
          status.textContent = "データを認識できません。形式を確認してください。";
          status.classList.add("error");
        } else {
          status.textContent = `${statCount}能力値・${skillCount}技能を読み込みました`;
          status.classList.remove("error");
        }
        const summary = $("summary-" + id);
        summary.replaceChildren();
        if (statCount) addChip(summary, `${statCount} 能力値`);
        if (skillCount) addChip(summary, `${skillCount} 技能`);
        if (!parsed.name && (statCount || skillCount)) addChip(summary, "名前なし");
        updateSelectors();
      }

      function addChip(parent, text) {
        const chip = document.createElement("span");
        chip.className = "data-chip";
        chip.textContent = text;
        parent.append(chip);
      }

      function setOptions(select, items, selectedValue) {
        const previous = selectedValue ?? select.value;
        select.replaceChildren();
        for (const [value, label] of items) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          select.append(option);
        }
        if (items.some(([value]) => value === previous)) select.value = previous;
      }

      function updateSelectors() {
        for (const id of ["a", "b"]) {
          const statSelect = $("attr-" + id);
          const statCurrent = statSelect.value || "STR";
          setOptions(statSelect, STAT_LABELS.map(([key, label]) => [key, `${label}${characters[id].stats[key] === undefined ? "" : ` (${characters[id].stats[key]})`}`]), statCurrent);
          const skillSelect = $("skill-" + id);
          const skillCurrent = skillSelect.value;
          const skills = Object.entries(characters[id].skills).sort(([left], [right]) => left.localeCompare(right, "ja"));
          setOptions(skillSelect, skills.length ? skills.map(([name, value]) => [name, `${name} (${value})`]) : [["", "技能データなし"]], skillCurrent);
          syncValue("attr-" + id, "attr-value-" + id, characters[id].stats);
          syncValue("skill-" + id, "skill-value-" + id, characters[id].skills);
        }
        updateSoloSkills();
        updateChances();
      }

      function syncValue(selectId, inputId, values) {
        const key = $(selectId).value;
        const value = values[key];
        if (value !== undefined) $(inputId).value = value;
      }

      function updateSoloSkills() {
        const id = $("solo-character").value;
        const select = $("solo-skill");
        const previous = select.value;
        const skills = Object.entries(characters[id].skills).sort(([left], [right]) => left.localeCompare(right, "ja"));
        setOptions(select, skills.length ? skills.map(([name, value]) => [name, `${name} (${value})`]) : [["", "技能データなし"]], previous);
        if (select.value && characters[id].skills[select.value] !== undefined) $("solo-value").value = characters[id].skills[select.value];
      }

      function chance(active, passive) {
        return Math.max(0, Math.min(100, 50 + (Number(active) - Number(passive)) * 5));
      }

      function updateChances() {
        $("attr-chance").innerHTML = `${chance($("attr-value-a").value, $("attr-value-b").value)}<small>%</small>`;
        $("skill-chance").innerHTML = `${chance($("skill-value-a").value, $("skill-value-b").value)}<small>%</small>`;
      }

      function d100() { return crypto.getRandomValues(new Uint32Array(1))[0] % 100 + 1; }

      function showResult(id, result, detail) {
        const box = $(id);
        box.replaceChildren();
        const text = document.createElement("span");
        text.className = "result-text " + result.className;
        text.textContent = result.text;
        const extra = document.createElement("span");
        extra.className = "result-detail";
        extra.textContent = detail;
        box.append(text, extra);
      }

      function skillOutcome(roll, target) {
        if (roll === 1) return { text: "クリティカル", className: "critical" };
        if ((target < 50 && roll >= 96) || roll === 100) return { text: "ファンブル", className: "failure" };
        if (roll > target) return { text: "失敗", className: "failure" };
        if (roll <= Math.floor(target / 5)) return { text: "イクストリーム成功", className: "success" };
        if (roll <= Math.floor(target / 2)) return { text: "ハード成功", className: "success" };
        return { text: "通常成功", className: "success" };
      }

      for (const id of ["a", "b"]) $("load-" + id).addEventListener("click", () => readCharacter(id));
      for (const id of ["attr-a", "attr-b", "skill-a", "skill-b"]) {
        $(id).addEventListener("change", () => {
          if (id.startsWith("attr-")) syncValue(id, id.replace("attr-", "attr-value-"), characters[id.endsWith("a") ? "a" : "b"].stats);
          else syncValue(id, id.replace("skill-", "skill-value-"), characters[id.endsWith("a") ? "a" : "b"].skills);
          updateChances();
        });
      }
      for (const id of ["attr-value-a", "attr-value-b", "skill-value-a", "skill-value-b"]) $(id).addEventListener("input", updateChances);
      $("solo-character").addEventListener("change", updateSoloSkills);
      $("solo-skill").addEventListener("change", updateSoloSkills);

      $("roll-attr").addEventListener("click", () => {
        const target = chance($("attr-value-a").value, $("attr-value-b").value);
        const roll = d100();
        const success = roll <= target;
        showResult("attr-result", { text: success ? "成功" : "失敗", className: success ? "success" : "failure" }, `出目 ${roll} / 目標 ${target}%`);
      });

      $("roll-skill-contest").addEventListener("click", () => {
        const target = chance($("skill-value-a").value, $("skill-value-b").value);
        const roll = d100();
        const success = roll <= target;
        showResult("skill-contest-result", { text: success ? "Aの対抗成功" : "Aの対抗失敗", className: success ? "success" : "failure" }, `出目 ${roll} / 目標 ${target}%`);
      });

      $("roll-solo").addEventListener("click", () => {
        const target = Number($("solo-value").value) || 0;
        const roll = d100();
        const outcome = skillOutcome(roll, target);
        showResult("solo-result", outcome, `出目 ${roll} / 技能値 ${target}`);
      });

      updateSelectors();
      }
    })();
  </script>
</body>
</html>
